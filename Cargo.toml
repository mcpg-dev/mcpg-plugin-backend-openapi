[package]
name = "mcpg-plugin-backend-openapi"
version = "0.1.0-alpha.16"
license = "Apache-2.0"
edition = "2024"
description = """
OpenAPI backend binding plugin for mcpg. Registers OpenAPI 3.0/3.1
specs as named `sources` in its own plugin config and exposes their
operations as MCP tools. Tier 1 (this crate's current scope): an
operator references one operation per binding via
`backend: { kind: openapi, source, operation }`; the plugin derives
the tool inputSchema/outputSchema from the operation and dispatches
the call as an outbound HTTP request, reusing net-core's
DNS-rebinding/SSRF guard, per-credential client cache, and the
structured response envelope the gateway projects onto tools/call.
"""

[lib]
# cdylib: the .so the gateway's native_loader dlopens. rlib: in-tree
# unit tests + the eager new() constructor.
crate-type = ["cdylib", "rlib"]

[features]
default = []
cdylib-export = []
# Declared empty so the SDK macro's `register_static` accessor does not
# trip `unexpected_cfgs`. openapi is consumed as a cdylib.
static-firstparty = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
# Shared HTTP-over-reqwest core: DNS-rebinding/SSRF guard
# (build_http_client → is_private_address) + per-credential client
# cache (ClientRegistry). http/grpc/graphql link the same crate so
# the SSRF guard lives in one place; openapi joins them.
mcpg-plugin-backend-net-core = { git = "https://github.com/mcpg-dev/mcpg-plugin-backend-net-core", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
mcpg-plugin-sdk      = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14", features = ["static-firstparty"] }
mcpg-plugin-host     = { git = "https://github.com/mcpg-dev/mcpg-plugin-host", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
anyhow         = "1"
async-trait    = "0.1"
base64         = "0.22"
bytes          = "1"
futures        = "0.3"
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
# Specs arrive as JSON or YAML; serde_yaml is already in the lock.
serde_yaml     = "0.9"
tokio          = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
tracing        = "0.1"
url            = "2"

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = "0.6"
